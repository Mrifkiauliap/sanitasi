services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: sanitasi_app
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ../storage:/var/www/storage
    env_file:
      - ../.env
    environment:
      - DB_HOST=db
    depends_on:
      - db
    networks:
      - sanitasi_network

  db:
    image: mysql:8.0
    container_name: sanitasi_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sanitasidb
      MYSQL_USER: sanitasi_user
      MYSQL_PASSWORD: XXXX
      MYSQL_ROOT_PASSWORD: XXXX*
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - sanitasi_network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: sanitasi_tunnel
    restart: unless-stopped
    command: tunnel run
    user: "0:0"
    volumes:
      - ../cloudflared:/etc/cloudflared:ro
    depends_on:
      - app
    networks:
      - sanitasi_network

volumes:
  db_data:

networks:
  sanitasi_network:
    driver: bridge
